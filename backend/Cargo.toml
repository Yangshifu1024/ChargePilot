[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/assets-admin",
    "crates/assets-h5",
    "crates/domain",
    "crates/events",
    "crates/gateway-runtime",
    "crates/http-api",
    "crates/platform",
    "crates/protocol",
    "crates/protocol-dc589",
    "crates/storage",
    "crates/modules/card",
    "crates/modules/charging",
    "crates/modules/device",
    "crates/modules/export",
    "crates/modules/identity",
    "crates/modules/marketing",
    "crates/modules/ops",
    "crates/modules/order",
    "crates/modules/payment",
    "crates/modules/pricing",
    "crates/modules/settlement",
    "crates/modules/wallet",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chargepilot-assets-admin = { path = "crates/assets-admin" }
chargepilot-assets-h5 = { path = "crates/assets-h5" }
# 异步运行时与 HTTP
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["fs"] }
rust-embed = { version = "8.14.0" }
# 数据库（手写 SQL，不开编译期校验宏）
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "migrate", "json", "derive"] }
# Redis（会话/MFA/频次/锁）
redis = { version = "0.31", features = ["tokio-comp"] }
deadpool-redis = "0.21"
# 序列化与错误
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
# 平台能力
jsonwebtoken = "9"
bcrypt = "0.17"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base32 = "0.5"
base64 = "0.22"
# 微信支付 APIv3：RSA-SHA256 签名/验签、AES-256-GCM 回调解密、RSA-OAEP 敏感信息加密
rsa = { version = "0.9", features = ["sha2"] }
aes-gcm = "0.10"
rand = "0.9"
subtle = "2"
# 可观测
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
# CLI 与配置
clap = { version = "4", features = ["derive"] }
# 定点十进制（计费域：语义对齐旧版 shopspring/decimal）
rust_decimal = { version = "1", features = ["maths"] }
rust_xlsxwriter = "0.79"
# 时间
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# 内部 crate
chargepilot-domain = { path = "crates/domain" }
chargepilot-events = { path = "crates/events" }
chargepilot-gateway-runtime = { path = "crates/gateway-runtime" }
chargepilot-http-api = { path = "crates/http-api" }
chargepilot-platform = { path = "crates/platform" }
chargepilot-protocol = { path = "crates/protocol" }
chargepilot-protocol-dc589 = { path = "crates/protocol-dc589" }
chargepilot-storage = { path = "crates/storage" }
# 内部 crate
chargepilot-mod-card = { path = "crates/modules/card" }
chargepilot-mod-charging = { path = "crates/modules/charging" }
chargepilot-mod-device = { path = "crates/modules/device" }
chargepilot-mod-export = { path = "crates/modules/export" }
chargepilot-mod-identity = { path = "crates/modules/identity" }
chargepilot-mod-marketing = { path = "crates/modules/marketing" }
chargepilot-mod-ops = { path = "crates/modules/ops" }
chargepilot-mod-order = { path = "crates/modules/order" }
chargepilot-mod-payment = { path = "crates/modules/payment" }
chargepilot-mod-pricing = { path = "crates/modules/pricing" }
chargepilot-mod-settlement = { path = "crates/modules/settlement" }
chargepilot-mod-wallet = { path = "crates/modules/wallet" }

[profile.release]
lto = "thin"
strip = "debuginfo"

# 工作区门禁（二期票 03）：rustc 警告即错误；clippy 失败级三组 + 解包禁令 +
# 通配枚举分支（护住 S3 枚举化的穷尽收益）。渐进路线（vector 式）：pedantic 不启用。
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
perf = "deny"
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
